services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-service-ollama
    restart: unless-stopped
    ports:
      - "${PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    # GPU (décommenter si nvidia-container-toolkit installé)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  init:
    image: ollama/ollama:latest
    container_name: ai-service-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${MODEL:-llama3.2:3b}"]
    restart: "no"

networks:
  default:
    name: ai-service-net

volumes:
  ollama-data:
    name: ai-service-data
